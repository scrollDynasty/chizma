name: Deploy editor to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build editor
        run: pnpm --filter @chizma/web build
        env:
          # Public URL of the API (set as a repository variable, not a secret).
          VITE_API_URL: ${{ vars.CHIZMA_API_URL }}
      - name: SPA fallback for deep links
        run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke test the live editor
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for _ in $(seq 1 12); do
            html="$(curl -fsS "$PAGE_URL" || true)"
            script="$(printf '%s' "$html" | grep -o 'assets/index-[^"]*\.js' | head -1)"
            if [ -n "$script" ] && printf '%s' "$html" | grep -q 'id="root"'               && curl -fsS -o /dev/null "${PAGE_URL%/}/$script"; then
              echo "Editor is live: $script"
              exit 0
            fi
            sleep 10
          done
          echo "Editor did not come up at $PAGE_URL" && exit 1
