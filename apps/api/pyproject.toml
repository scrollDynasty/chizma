[project]
name = "chizma-api"
version = "0.1.0"
description = "Chizma API: sketch recognition, generation and auth"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.143.0",
  "gunicorn>=26.2.0",
  "pydantic-settings>=2.15.0",
  "sqlalchemy>=2.1.4",
  "alembic>=1.20.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.10",
  "mypy>=2.4.0",
  "pip-audit>=2.10.1",
  "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chizma_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM"]
ignore = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
